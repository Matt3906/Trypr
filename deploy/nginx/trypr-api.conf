# Trypr — REFERENCE COPY of the shared-nginx server block for the API (api.tryprtravel.com).
# Installed on the droplet as /apps/shared-nginx/nginx/conf.d/trypr-api.conf by
# `./deploy.sh setup` (deploy/scripts/setup-droplet.sh). Diff it against this copy when /api misbehaves.
#
# The droplet does NOT serve the website: the React app is static files on Hostinger
# (tryprtravel.com). DNS: `api` A record -> the droplet; apex + www -> Hostinger.
#
# Port 80 (ACME challenge + HTTPS redirect) is handled for every host by 00-http.conf.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.tryprtravel.com;

    ssl_certificate     /etc/letsencrypt/live/api.tryprtravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tryprtravel.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types application/json text/plain text/css application/xml text/xml;

    # No CORS headers here on purpose: FastAPI's CORSMiddleware (CORS_ORIGINS) owns them;
    # adding them in nginx too would send duplicates, which browsers reject.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # File uploads (trip documents/photos). Keep in step with MAX_UPLOAD_MB (+ multipart overhead).
    client_max_body_size 30m;

    # Resolve the backend through a variable so nginx still starts (and the other site keeps
    # working) when trypr-backend is down or not deployed yet.
    location / {
        resolver 127.0.0.11 valid=10s;   # Docker's embedded DNS
        set $trypr_backend trypr-backend;
        proxy_pass http://$trypr_backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
