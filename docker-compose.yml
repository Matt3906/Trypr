# Trypr — SHARED-SERVER layout (same droplet as Refey, see /apps/README.md on the droplet).
# This project owns ONLY its backend + Postgres. The website is static files on Hostinger.
# TLS and routing are done by the single shared nginx in /apps/shared-nginx, which reaches
# `trypr-backend` over the external `trypr-net` network (api.tryprtravel.com -> trypr-backend:8080).
#
# Prereq (created once by /apps/setup.sh or deploy/scripts/setup-droplet.sh): docker network `trypr-net`.
# Config comes from .env.production (copy .env.production.example). NEVER commit it.
#
# NO host ports are published — only the shared nginx binds 80/443.

name: trypr

services:
  db:
    image: postgres:16-alpine
    container_name: trypr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - trypr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trypr-net

  backend:
    build:
      context: ./backend
    image: trypr-backend:latest
    container_name: trypr-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Always talk to this project's own Postgres, whatever the env file says.
      DB_HOST: trypr-db
      DB_PORT: "5432"
      ENVIRONMENT: production
      UPLOAD_DIR: /data/uploads
    volumes:
      - trypr-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8080/healthz',timeout=5).status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - trypr-net

networks:
  trypr-net:
    external: true

volumes:
  trypr-pgdata:
  trypr-uploads:
