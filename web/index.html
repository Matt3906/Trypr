<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    This is a placeholder for base href that will be replaced by the value of

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Trypr – Plan Trips Together</title>
  <link rel="canonical" href="https://trypr.co/">

  <!-- Primary SEO -->
  <meta name="description" content="Trypr is the collaborative trip planner for multi-stop adventures. Build 2D and 3D routes, manage itineraries, packing lists, shared budgets, and group chat — all in one place.">
  <meta name="keywords" content="trip planner, collaborative travel, route planner, itinerary builder, group travel, packing list, travel budget, multi-stop trips">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Trypr">

  <!-- Open Graph (Facebook, LinkedIn, iMessage previews) -->

  <meta property="og:title" content="Trypr – Plan Trips Together">
  <meta property="og:description" content="Collaborative trip planning with 2D &amp; 3D route building, shared itineraries, packing lists, budgets, and group chat.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://trypr.co/">
  <meta property="og:image" content="https://trypr.co/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@tryprco">
  <meta name="twitter:title" content="Trypr – Plan Trips Together">
  <meta name="twitter:description" content="Collaborative trip planning with routes, itineraries, packing, budgets, and group chat.">
  <meta name="twitter:image" content="https://trypr.co/icons/Icon-512.png">

  <!-- JSON-LD: WebSite + Sitelinks Search Box + quick navigation links -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://trypr.co/#website",
        "url": "https://trypr.co/",
        "name": "Trypr",
        "description": "Collaborative trip planner for multi-stop adventures.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://trypr.co/#search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "WebPage",
        "@id": "https://trypr.co/#homepage",
        "url": "https://trypr.co/",
        "name": "Trypr – Plan Trips Together",
        "isPartOf": { "@id": "https://trypr.co/#website" },
        "description": "Plan multi-stop trips with route tools, shared itineraries, packing lists, budgets, and group collaboration.",
        "breadcrumb": {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "item": "https://trypr.co/"
            }
          ]
        }
      },
      {
        "@type": "SiteLinksNavigationElement",
        "name": "Quick Links",
        "hasPart": [
          {
            "@type": "SiteLinksNavigationElement",
            "name": "Plan a Trip",
            "url": "https://trypr.co/#/trip-builder"
          },
          {
            "@type": "SiteLinksNavigationElement",
            "name": "My Trips",
            "url": "https://trypr.co/#/my-trips"
          },
          {
            "@type": "SiteLinksNavigationElement",
            "name": "Explore",
            "url": "https://trypr.co/#/explore"
          },
          {
            "@type": "SiteLinksNavigationElement",
            "name": "About Trypr",
            "url": "https://trypr.co/about"
          }
        ]
      },
      {
        "@type": "Organization",
        "@id": "https://trypr.co/#organization",
        "name": "Trypr",
        "url": "https://trypr.co/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://trypr.co/icons/Icon-512.png",
          "width": 512,
          "height": 512
        },
        "sameAs": []
      }
    ]
  }

  <!-- Google Maps API key for hosted builds (alternative to --dart-define=GOOGLE_MAPS_API_KEY=...) -->
  <meta name="google-maps-api-key" content="AIzaSyCGH2idy-P-0FIr_UK0rDIJjaoJknRd2nw">

  <!-- Google Maps Map ID for vector/3D maps (optional for hosted builds) -->
  <meta name="google-maps-map-id" content="">

  <!-- Optional routing keys for Trip Builder mode-specific engines -->
  <meta name="openrouteservice-api-key" content="">
  <meta name="graphhopper-api-key" content="">

  <!-- Google Maps JS is loaded inside iframe-based widgets (map.html, map_embed_web) -->
  <!-- No script tag needed here – prevents __gmapsCallback interop errors -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trypr">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png"/>

  <!--
    Platform-view z-ordering is managed by Flutter's compositing engine.
    Keep flt-glass-pane above platform views so the Flutter canvas is visible.
    Do NOT force flt-platform-view to z-index:0 — that breaks compositing
    of overlay platform views like WebInterceptor / PointerInterceptor.
  -->
  <style>
    flt-glass-pane {
      z-index: 1 !important;
    }

    /* Soft welcoming loading screen */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #FAFAFA;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease-out;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    .loading-gif {
      width: 200px;
      height: auto;
      margin-bottom: 24px;
    }
    .loading-dots {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .loading-dot {
      width: 10px;
      height: 10px;
      background: #00B894;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .loading-dot:nth-child(1) { animation-delay: 0s; }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    .loading-text {
      color: #555;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      margin-top: 20px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    @keyframes bounce {
      0%, 80%, 100% { 
        transform: scale(0.6);
        opacity: 0.5;
      }
      40% { 
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Loading screen -->
  <div id="loading">
    <img src="assets/images/TryprLogo_Black.png" alt="Trypr" class="loading-gif">
    <div class="loading-dots">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
    <div class="loading-text">Getting things ready...</div>
  </div>
  
  <script>
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('hide');
        setTimeout(function() { loading.remove(); }, 500);
      }
    });
    
    // Fallback: hide after 15 seconds
    setTimeout(function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('hide');
        setTimeout(function() { loading.remove(); }, 500);
      }
    }, 15000);
  </script>
  <script>
    (function () {
      var hostname = window.location.hostname;
      var isLocalhost =
        hostname === 'localhost' ||
        hostname === '127.0.0.1' ||
        hostname === '::1';
      if (!isLocalhost || !('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(
          regs.map(function (reg) {
            return reg.unregister();
          }),
        );
      });
    })();
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
