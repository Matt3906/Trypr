<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="A new Flutter project.">

  <!-- Google Maps API key for hosted builds (alternative to --dart-define=GOOGLE_MAPS_API_KEY=...) -->
  <meta name="google-maps-api-key" content="">

  <!-- Google Maps Map ID for vector/3D maps (optional for hosted builds) -->
  <meta name="google-maps-map-id" content="">

  <!-- Google Maps JS is loaded inside iframe-based widgets (map.html, map_embed_web) -->
  <!-- No script tag needed here – prevents __gmapsCallback interop errors -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="trypr">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/TryprLogo_Black.png"/>

  <!--
    Platform-view z-ordering is managed by Flutter's compositing engine.
    Keep flt-glass-pane above platform views so the Flutter canvas is visible.
    Do NOT force flt-platform-view to z-index:0 — that breaks compositing
    of overlay platform views like WebInterceptor / PointerInterceptor.
  -->
  <style>
    flt-glass-pane {
      z-index: 1 !important;
    }

    /* Soft welcoming loading screen */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #FAFAFA;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease-out;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    .loading-gif {
      width: 200px;
      height: auto;
      margin-bottom: 24px;
    }
    .loading-dots {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .loading-dot {
      width: 10px;
      height: 10px;
      background: #00B894;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .loading-dot:nth-child(1) { animation-delay: 0s; }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    .loading-text {
      color: #555;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      margin-top: 20px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    @keyframes bounce {
      0%, 80%, 100% { 
        transform: scale(0.6);
        opacity: 0.5;
      }
      40% { 
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>

  <title>trypr</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Loading screen -->
  <div id="loading">
    <img src="assets/images/TryprLogo_Black.png" alt="Trypr" class="loading-gif">
    <div class="loading-dots">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
    <div class="loading-text">Getting things ready...</div>
  </div>
  
  <script>
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('hide');
        setTimeout(function() { loading.remove(); }, 500);
      }
    });
    
    // Fallback: hide after 15 seconds
    setTimeout(function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('hide');
        setTimeout(function() { loading.remove(); }, 500);
      }
    }, 15000);
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
