<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="A new Flutter project.">

  <!-- Google Maps API key for hosted builds (alternative to --dart-define=GOOGLE_MAPS_API_KEY=...) -->
  <meta name="google-maps-api-key" content="">

  <!-- Google Maps Map ID for vector/3D maps (optional for hosted builds) -->
  <meta name="google-maps-map-id" content="">

  <!-- Load Google Maps JS API if the meta tag is set -->
  <script>
    (function () {
      try {
        var meta = document.querySelector('meta[name="google-maps-api-key"]');
        var key = (meta && meta.getAttribute('content') || '').trim();
        if (!key) return;

        // Avoid double-injecting if another script already loaded the API.
        if (window.google && window.google.maps) return;

        var s = document.createElement('script');
        s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&loading=async';
        s.async = true;
        s.defer = true;
        document.head.appendChild(s);
      } catch (e) {
        // ignore
      }
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="trypr">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/TryprLogo_Black.png"/>

  <!-- Ensure platform views (e.g., Google Maps) don't sit above Flutter overlays -->
  <style>
    flt-platform-view, flt-platform-view-slot {
      z-index: 0 !important;
    }
    flt-glass-pane {
      z-index: 1 !important;
    }
  </style>

  <title>trypr</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
